## TLS mode (make up TLS=1): AMQP and stream clients must use TLS. up.sh assembles the TLS conf.d
## from 10-rmq-verify.conf without its plain listeners, plus this file. Test certificates only, from
## deploy/scripts/gen-test-certs.sh. Inter-node traffic stays on the Erlang distribution.
listeners.tcp = none
listeners.ssl.default = 5671
stream.listeners.tcp = none
stream.listeners.ssl.1 = 5551

ssl_options.cacertfile = /etc/rabbitmq/tls/ca.pem
ssl_options.certfile = /etc/rabbitmq/tls/server.pem
ssl_options.keyfile = /etc/rabbitmq/tls/server.key
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false

## rmq-verify test cluster. This file replaces the defaults of the official image, which allow
## the guest user from any host.

loopback_users.guest = true

cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2
cluster_formation.classic_config.nodes.3 = rabbit@rabbit3

## Mnesia-based clusters (3.13): a minority side pauses instead of diverging.
cluster_partition_handling = pause_minority

listeners.tcp.default = 5672
management.tcp.port = 15672
stream.listeners.tcp.1 = 5552

## Logs go to the container output only; the root file system is read-only.
log.console = true
log.console.level = info
log.file = false

vm_memory_high_watermark.absolute = 600MiB
disk_free_limit.absolute = 256MiB

## Fail fast enough for faults to be observable within a run.
net_ticktime = 15
heartbeat = 10

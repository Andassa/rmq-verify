name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: make verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Quality gate (format, lint, tests, coverage, ArchUnit, SpotBugs, PIT)
        run: make verify
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-reports
          path: |
            **/target/site/jacoco/
            **/target/pit-reports/
            **/target/spotbugsXml.xml
            **/target/surefire-reports/
          retention-days: 14

  e2e:
    name: end-to-end (real cluster, real faults)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        rabbitmq: ['3.13', '4.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: End-to-end scenarios
        env:
          RABBITMQ: ${{ matrix.rabbitmq }}
        run: make e2e
      - name: Upload e2e artefacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-${{ matrix.rabbitmq }}
          path: rmq-verify-e2e/target/failsafe-reports/
          retention-days: 14

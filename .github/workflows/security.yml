name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action scans firstPushedCommit^..HEAD. That parent does not exist when the
      # push contains the root commit, so the scan exits before reading a single file. The full
      # history is what deploy/scripts/scan.sh checks locally. Version and checksum match that script.
      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" \
            | sha256sum -c
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan the Git history
        run: gitleaks detect --source . --redact --no-banner --exit-code 2 --report-format sarif --report-path gitleaks.sarif
      - name: Upload the gitleaks report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-results.sarif
          path: gitleaks.sarif
          retention-days: 14

  dependencies:
    name: OWASP Dependency-Check and CycloneDX SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache NVD data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ hashFiles('pom.xml', 'rmq-verify-bom/pom.xml') }}
          restore-keys: nvd-${{ runner.os }}-
      - name: Dependency-Check (fails on CVSS >= 7) and SBOM
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -Psecurity dependency:resolve-plugins
          deploy/scripts/blank-nvd-key.sh
          # An absent GitHub secret is the empty string. Leave it unset so it cannot be sent as a key.
          if [ -z "${NVD_API_KEY}" ]; then
            unset NVD_API_KEY
          fi
          ./mvnw -B -ntp -Psecurity -DskipTests install
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: target/dependency-check-report.sarif
          category: dependency-check
      - name: Upload SBOM and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-and-dependency-check
          path: |
            target/rmq-verify-sbom.json
            target/dependency-check-report.html
          retention-days: 30

  static-analysis:
    name: SpotBugs + FindSecBugs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and analyse
        run: ./mvnw -B -ntp -DskipTests install

  images:
    name: Trivy (pinned images and deployment configuration)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [RABBITMQ_3_13, RABBITMQ_4_4, TOXIPROXY]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve the pinned image
        id: image
        run: echo "ref=$(grep '^${{ matrix.image }}=' deploy/images.env | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  configuration:
    name: Trivy (Dockerfile and Compose misconfigurations)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: deploy
          severity: CRITICAL,HIGH
          exit-code: '1'

version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      quality-plugins:
        patterns:
          - "com.github.spotbugs*"
          - "com.puppycrawl*"
          - "com.diffplug*"
          - "org.pitest*"
          - "org.jacoco*"
          - "com.google.errorprone*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy/rabbitmq
    schedule:
      interval: weekly
